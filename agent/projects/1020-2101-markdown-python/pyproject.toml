[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md2txt"
version = "0.1.0"
description = "Markdown 转纯文本命令行工具，支持管道输入"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "md2txt contributors" }]
keywords = ["markdown", "plaintext", "cli", "pipe"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["markdown-it-py>=3.0,<4"]

[project.scripts]
md2txt = "md2txt.cli:main"

[tool.setuptools]
packages = ["md2txt"]
